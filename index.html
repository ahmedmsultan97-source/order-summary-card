<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="description" content="this is our BookStore" />
    <title>Order Summary</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="header"> <img src="images/illustration-hero.svg" alt=""></div>
        <div class="summary">
            <div class="content">
                <h2>Order Summary</h2>
                <p>You can now listen to milions of songs, audiobooks, and bodcasts on any device anywhere you like!
                </p>
            </div>
            <div class="plan">
                <div class="plan-info">
                    <img src="images/icon-music.svg" alt="">
                    <div class="details">
                        <h4>Annual Plan</h4>
                        <span>$59.99/year</span>
                    </div>
                </div>
                <button class="btn link">Change</button>
            </div>

            <div class="footer">
                <button class="btn primary">Proceed to Payment</button>
                <button class="btn cancel"> Cancel Order</button>
            </div>
        </div>

    </div>
    </div>
</body>

</html>
